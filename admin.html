<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 | 우리 반 공지</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/attachments.css"></head><body data-page="admin"><header class="site-header"><a class="brand" href="index.html">우리 반 공지</a><nav aria-label="주 메뉴"><a href="index.html">학생 화면</a><button id="logout-button" class="nav-button">로그아웃</button></nav></header><main class="container admin-main"><div class="admin-title"><p class="eyebrow">ADMIN DASHBOARD</p><h1>공지 · 일정 관리</h1><p class="muted">저장하면 학생 화면에 바로 반영됩니다.</p></div><div id="admin-error" class="form-error" role="alert"></div><section class="admin-section"><div class="section-heading"><h2>공지사항 관리</h2><button id="new-announcement" class="button primary">+ 공지 추가</button></div><form id="announcement-form" class="editor" hidden><input name="id" type="hidden"><label>제목<input name="title" maxlength="100" required></label><label>내용<textarea name="content" rows="6" maxlength="5000" required></textarea></label><label>첨부 이미지<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label class="check-label"><input name="remove_image" type="checkbox"> 기존 첨부 이미지 삭제</label><label class="check-label"><input name="is_important" type="checkbox"> 중요 공지로 고정</label><div class="form-actions"><button class="button primary" type="submit">저장</button><button type="button" class="button secondary cancel-edit">취소</button></div></form><div id="admin-announcements" class="admin-list"></div></section><section class="admin-section"><div class="section-heading"><h2>일정 관리</h2><button id="new-schedule" class="button primary">+ 일정 추가</button></div><form id="schedule-form" class="editor" hidden><input name="id" type="hidden"><label>날짜<input name="event_date" type="date" required></label><label>제목<input name="title" maxlength="100" required></label><label>설명<textarea name="description" rows="4" maxlength="2000"></textarea></label><div class="form-actions"><button class="button primary" type="submit">저장</button><button type="button" class="button secondary cancel-edit">취소</button></div></form><div id="admin-schedules" class="admin-list"></div></section><section class="admin-section"><div class="section-heading"><h2>공휴일 관리</h2><button id="new-holiday" class="button primary">+ 공휴일 추가</button></div><form id="holiday-form" class="editor" hidden><input name="id" type="hidden"><label>날짜<input name="holiday_date" type="date" required></label><label>공휴일 이름<input name="name" maxlength="100" placeholder="예: 광복절" required></label><div class="form-actions"><button class="button primary" type="submit">저장</button><button type="button" class="button secondary cancel-edit">취소</button></div></form><div id="admin-holidays" class="admin-list"></div></section><section class="admin-section"><h2>시간표 관리</h2><form id="timetable-form" class="editor"><label>시간표 이미지<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><button class="button primary" type="submit">시간표 저장</button></form></section><section class="admin-section"><h2>급식표 관리</h2><form id="meal-form" class="editor"><label>급식표 이미지<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><button class="button primary" type="submit">급식표 저장</button></form></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script><script src="js/holidays-admin.js"></script></body></html>
